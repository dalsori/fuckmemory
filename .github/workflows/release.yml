name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild assets for"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build (release)
        run: cargo build --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/fuckmemory dist/fuckmemory
          tar -czf dist/fuckmemory-${{ matrix.target }}.tar.gz -C dist fuckmemory
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fuckmemory.exe dist/fuckmemory.exe
          Compress-Archive -Path dist/fuckmemory.exe -DestinationPath dist/fuckmemory-${{ matrix.target }}.zip
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # The `release: published` event can fire before the release is
          # queryable through the API, which makes `gh release upload` fail with
          # "release not found". Wait for it, with a hard cap.
          for i in $(seq 1 20); do
            if gh release view "$TAG" --json id >/dev/null 2>&1; then
              break
            fi
            echo "release $TAG not visible yet, waiting ($i/20)…"
            sleep 15
          done
          gh release upload "$TAG" dist/* --clobber