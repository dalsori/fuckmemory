[package]
name = "fuckmemory"
version = "1.1.2"
edition = "2021"
rust-version = "1.85"
description = "Local-first temporal knowledge-graph memory shared by every AI coding agent you use"
license = "MIT"
repository = "https://github.com/dalsori/fuckmemory"
readme = "README.md"
keywords = ["mcp", "memory", "agents", "knowledge-graph", "embeddings"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "fuckmemory"
path = "src/main.rs"

[lib]
name = "fuckmemory"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# The fast embedding path (src/fast.rs) reads the model's own safetensors and
# reimplements its WordPiece pipeline, so it needs the same primitives the
# reference implementation uses. All four already come in through model2vec-rs
# and tokenizers, so depending on them directly costs no extra build time.
half = "2"
memmap2 = "0.9"
safetensors = "0.5"
unicode-normalization-alignments = "0.1"
unicode_categories = "0.1"
# Used directly (not just through model2vec-rs) so the model lands in our own
# data dir instead of the shared HuggingFace cache: model2vec-rs calls
# `Api::new()`, which resolves the cache via `Cache::default()` and ignores HF_HOME.
# `native-tls` is deliberately off: it needs OpenSSL headers at build time. ureq
# brings its own rustls, which keeps this a pure-Rust static build.
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
jsonc-parser = { version = "0.26", features = ["serde"] }
model2vec-rs = "0.2"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.24"
ratatui = { version = "0.29", features = ["crossterm"] }

# `fuckmemory update` self-replaces this binary from a GitHub release asset.
# `ureq` already arrives via hf-hub; `flate2`/`tar`/`zip` are the archive readers,
# and the latter two are pinned to the platform that needs them.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
flate2 = "1"
[target.'cfg(unix)'.dependencies]
tar = "0.4"
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1"
